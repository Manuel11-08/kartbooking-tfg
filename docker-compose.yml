services:


  nginx:
    image: nginx:alpine
    container_name: kartbooking_nginx
    ports:
      - "8080:80"          
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kartbooking_net

 
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kartbooking_app
    volumes:
      - .:/var/www
      - /var/www/vendor       
      - /var/www/node_modules  
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kartbooking_net

  
  db:
    image: mysql:8.0
    container_name: kartbooking_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kartbooking
      MYSQL_ROOT_PASSWORD: kartbooking_root_pass
    ports:
      - "3307:3306"    
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kartbooking_net

volumes:
  mysql_data:

networks:
  kartbooking_net:
    driver: bridge